name: Build DYYY34 step1
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          git -C "$HOME/theos" submodule update --init --recursive
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          rm -rf "$HOME/theos/sdks"; mv "$RUNNER_TEMP/sdks" "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          brew install ldid
      - run: |
          make -f Makefile.step3 clean || true
          make -f Makefile.step3 build ARCHS=arm64 FINALPACKAGE=1
          mkdir -p artifact
          cp build-step3/DYYY34Step3.dylib build-step3/DYYY34Step3.plist artifact/
          codesign -s - --force artifact/DYYY34Step3.dylib
          file artifact/DYYY34Step3.dylib
          ditto -c -k --sequesterRsrc artifact artifact/DYYY34Step3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DYYY34-step3-arm64
          path: artifact/*
